apply plugin: 'com.android.application'

android {
    compileSdk 33

    defaultConfig {
        applicationId "io.appium.android.apis"
        minSdkVersion 26
        targetSdkVersion 33

        versionCode 36
        versionName '6.0.10'

        testApplicationId "io.appium.android.apis.test"
        testInstrumentationRunner ".app.LocalSampleInstrumentation"
    }

    dependencies {
        implementation 'androidx.appcompat:appcompat:1.7.1'
        implementation 'io.appium:java-client:9.2.2'
        implementation 'org.testng:testng:7.10.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }
    buildFeatures {
        aidl = true
        buildConfig = true
    }
    namespace = 'io.appium.android.apis'
}
